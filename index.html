<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#431407" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="威敏信条测试" />
  <title>《威斯敏斯特信条》在线测试</title>
  <link rel="stylesheet" href="app.css" />
  <script src="app.js"></script>
  <script src="chapters.js"></script>
</head>
<body>

  <header class="appbar">
    <span class="appbar-btn" aria-hidden="true">✝</span>
    <div class="appbar-title">威斯敏斯特信条测试</div>
    <a class="appbar-btn" href="records.html" aria-label="我的记录">👤</a>
  </header>

  <main class="app-main">
    <div class="page-head">
      <h1>试题目录</h1>
      <p id="listSummary">共 33 章</p>
    </div>

    <div style="margin-bottom:12px;">
      <input id="chapterFilter" class="filter-input" type="text" placeholder="搜索章节（如：圣经 / 三位一体）" oninput="renderChapters()" />
    </div>

    <div class="section-label">📖 章节列表</div>
    <div class="chapter-list" id="chapterList"></div>

    <a class="chapter-row" href="records.html" style="margin-top:14px;">
      <div class="num" style="background:linear-gradient(135deg,#1e293b,#334155);">👤</div>
      <div class="info">
        <h3>我的记录 / 错题集</h3>
        <p>成绩记录、个人错题集、本机成绩榜</p>
      </div>
      <div class="go">›</div>
    </a>
  </main>

  <nav class="tabbar">
    <a class="tab-item" href="index.html"><span class="ico">🏠</span>目录</a>
    <a class="tab-item" id="tabContinue" href="quiz.html?ch=1"><span class="ico">▶</span>继续</a>
    <a class="tab-item" href="records.html"><span class="ico">👤</span>我的</a>
  </nav>

  <script>
    function renderChapters() {
      const kw = (document.getElementById("chapterFilter").value || "").trim().toLowerCase();
      const list = document.getElementById("chapterList");
      const all = window.WCF_CHAPTERS || [];
      const items = all.filter(c => {
        if (!kw) return true;
        const hay = (String(c.num) + " " + (c.title || "") + " " + (c.desc || "")).toLowerCase();
        return hay.indexOf(kw) !== -1;
      });

      if (!items.length) {
        list.innerHTML = '<div class="empty">未找到匹配的章节</div>';
        return;
      }

      let html = "";
      items.forEach(c => {
        const disabled = !c.ready;
        const inner =
          '<div class="num">' + c.num + '</div>' +
          '<div class="info">' +
            '<h3>' + c.title + (c.ready ? '' : ' <span class="chip">待上线</span>') + '</h3>' +
            (c.desc ? '<p>' + c.desc + '</p>' : '') +
          '</div>' +
          (c.ready ? '<div class="go">›</div>' : '');

        html += disabled
          ? '<div class="chapter-row disabled">' + inner + '</div>'
          : '<a class="chapter-row" href="quiz.html?ch=' + c.num + '">' + inner + '</a>';
      });
      list.innerHTML = html;
    }

    (function init() {
      const all = window.WCF_CHAPTERS || [];
      const ready = all.filter(c => c.ready).length;
      const el = document.getElementById("listSummary");
      if (el) el.textContent = `共 ${all.length} 章 · 已上线 ${ready} 章`;
      renderChapters();
    })();
  </script>
</body>
</html>
