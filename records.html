<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#431407" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>我的记录 / 错题集 · 威斯敏斯特信条在线测试</title>
  <link rel="stylesheet" href="app.css" />
  <script src="app.js"></script>
</head>
<body>

  <header class="appbar">
    <a class="appbar-btn" href="index.html" aria-label="返回目录">‹</a>
    <div class="appbar-title">我的记录</div>
    <button class="appbar-btn" onclick="clearAll()" aria-label="清空记录">🗑</button>
  </header>

  <main class="app-main">
    <div class="card" style="padding:14px 16px;">
      <div class="field" style="margin-top:0;">
        <label for="nameInput">我的姓名</label>
        <input id="nameInput" type="text" placeholder="请输入姓名" />
      </div>
      <div class="hint" style="margin-top:10px;">数据仅保存在当前浏览器（localStorage）中，换设备或清除浏览器数据后会丢失。</div>
    </div>

    <section class="card">
      <h2>👤 个人概况</h2>
      <div class="stats-grid" id="personalStats"></div>
      <div class="hint" id="personalHint"></div>
    </section>

    <section class="card">
      <h2>📝 我的考试记录</h2>
      <div id="historyWrap"></div>
    </section>

    <section class="card">
      <h2>❌ 我的错题集</h2>
      <div id="wrongWrap"></div>
    </section>

    <section class="card">
      <h2>🏆 本机成绩榜</h2>
      <div id="boardWrap"></div>
      <div class="hint">此榜仅统计<strong>本机本浏览器</strong>记录过的考生，并非全员排名（全员排名需云端数据库支持）。</div>
    </section>
  </main>

  <nav class="tabbar">
    <a class="tab-item" href="index.html"><span class="ico">🏠</span>目录</a>
    <a class="tab-item" id="tabContinue" href="quiz.html?ch=1"><span class="ico">▶</span>继续</a>
    <a class="tab-item" href="records.html"><span class="ico">👤</span>我的</a>
  </nav>

  <script>
    function escapeHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function fmtDate(iso) {
      try {
        const d = new Date(iso);
        const p = n => String(n).padStart(2, "0");
        return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
          " " + p(d.getHours()) + ":" + p(d.getMinutes());
      } catch (e) { return iso; }
    }

    function currentName() {
      return (WCF.getName() || "").trim();
    }

    function renderPersonal(records) {
      const name = currentName();
      const box = document.getElementById("personalStats");
      const hint = document.getElementById("personalHint");

      if (!name) {
        box.innerHTML = `<div class="stat-box"><div class="num">--</div><div class="lbl">尚未录入姓名</div></div>`;
        hint.textContent = "请在上方输入你的姓名，然后到任一章节完成测试，即可记录成绩与错题。";
        return;
      }

      const mine = records.filter(r => (r.name || "") === name);
      const attempts = mine.length;
      const best = attempts ? Math.max.apply(null, mine.map(r => r.score || 0)) : 0;
      const avg = attempts ? Math.round(mine.reduce((s, r) => s + (r.score || 0), 0) / attempts) : 0;

      box.innerHTML =
        `<div class="stat-box"><div class="num">${attempts}</div><div class="lbl">考试次数</div></div>` +
        `<div class="stat-box"><div class="num">${best}</div><div class="lbl">最高分</div></div>` +
        `<div class="stat-box"><div class="num">${avg}</div><div class="lbl">平均分</div></div>`;

      hint.textContent = attempts
        ? `以上统计基于本机保存的「${name}」的记录。`
        : `本机尚未保存「${name}」的记录，请到章节页面完成一次测试（考试模式交卷或练习模式答完）后返回。`;
    }

    function renderHistory(records) {
      const name = currentName();
      const wrap = document.getElementById("historyWrap");
      const mine = name ? records.filter(r => (r.name || "") === name).slice().reverse() : [];

      if (!mine.length) {
        wrap.innerHTML = `<div class="empty">暂无考试记录</div>`;
        return;
      }

      let html = "";
      mine.forEach(r => {
        html += `<div class="record-row">
          <div>
            <div>${escapeHtml(r.chapterLabel || r.chapterId || "")}</div>
            <div class="when">${fmtDate(r.date)} · 答对 ${r.correct}/${r.total} · 错题 ${(r.wrongItems && r.wrongItems.length) || 0}</div>
          </div>
          <div class="sc">${r.score} 分</div>
        </div>`;
      });

      wrap.innerHTML = html;
    }

    function renderWrong(records) {
      const name = currentName();
      const wrap = document.getElementById("wrongWrap");
      const mine = name ? records.filter(r => (r.name || "") === name) : [];

      const map = {};
      mine.forEach(r => {
        (r.wrongItems || []).forEach(w => {
          const key = (r.chapterId || "") + "#" + w.id;
          if (!map[key]) {
            map[key] = { chapterLabel: r.chapterLabel || r.chapterId || "", item: w, count: 0, lastPicked: w.picked };
          }
          map[key].count += 1;
          map[key].lastPicked = w.picked;
          map[key].item = w;
        });
      });

      const keys = Object.keys(map);
      if (!keys.length) {
        wrap.innerHTML = `<div class="empty">${name ? "太棒了！目前没有错题记录。" : "请先录入姓名。"}</div>`;
        return;
      }

      keys.sort((a, b) => {
        const ca = map[a].chapterLabel, cb = map[b].chapterLabel;
        if (ca !== cb) return ca.localeCompare(cb);
        return map[a].item.id - map[b].item.id;
      });

      let html = "";
      keys.forEach(k => {
        const entry = map[k];
        const w = entry.item;
        const pickedText = entry.lastPicked
          ? `${entry.lastPicked}. ${escapeHtml((w.options || {})[entry.lastPicked] || "")}`
          : "未作答";
        const correctText = `${w.answer}. ${escapeHtml((w.options || {})[w.answer] || "")}`;

        html += `<div class="wrong-item">
          <div class="wrong-head">
            <span class="chip brand">${escapeHtml(entry.chapterLabel)} · 第 ${w.id} 题</span>
            <span class="chip">错误 ${entry.count} 次</span>
          </div>
          <div class="wrong-q">${escapeHtml(w.question)}</div>
          <div class="ans-line"><span class="k">你的答案：</span><span class="ans-picked">${pickedText}</span></div>
          <div class="ans-line"><span class="k">正确答案：</span><span class="ans-correct">${correctText}</span></div>
          <div class="explain"><strong>解析：</strong>${escapeHtml(w.explanation)}</div>
        </div>`;
      });

      wrap.innerHTML = html;
    }

    function renderBoard(records) {
      const wrap = document.getElementById("boardWrap");
      const name = currentName();
      const agg = {};

      records.forEach(r => {
        const n = (r.name || "").trim() || "匿名";
        if (!agg[n]) agg[n] = { attempts: 0, best: 0, total: 0 };
        agg[n].attempts += 1;
        agg[n].total += (r.score || 0);
        agg[n].best = Math.max(agg[n].best, r.score || 0);
      });

      const names = Object.keys(agg);
      if (!names.length) {
        wrap.innerHTML = `<div class="empty">本机暂无任何成绩记录</div>`;
        return;
      }

      names.sort((a, b) => agg[b].best - agg[a].best || agg[b].attempts - agg[a].attempts);

      let html = "";
      names.forEach((n, i) => {
        const a = agg[n];
        const avg = Math.round(a.total / a.attempts);
        const me = n === name;
        html += `<div class="rank-row ${i < 3 ? "top" : ""}">
          <div class="rank-no">${i + 1}</div>
          <div class="who">${escapeHtml(n)}${me ? ' <span class="chip brand">我</span>' : ""}
            <div class="detail">平均 ${avg} 分 · ${a.attempts} 次</div>
          </div>
          <div class="best">${a.best}</div>
        </div>`;
      });

      wrap.innerHTML = html;
    }

    function refresh() {
      const records = WCF.getRecords();
      renderPersonal(records);
      renderHistory(records);
      renderWrong(records);
      renderBoard(records);
    }

    function clearAll() {
      if (!confirm("确定清空本机保存的全部考试记录吗？此操作不可撤销。")) return;
      WCF.clearAll();
      refresh();
    }

    document.getElementById("nameInput").addEventListener("input", function () {
      WCF.setName(this.value);
      refresh();
    });

    (function init() {
      document.getElementById("nameInput").value = currentName();
      refresh();
    })();
  </script>
</body>
</html>
